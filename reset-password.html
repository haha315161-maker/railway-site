<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifreyi Yenile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-box">

  <a href="/login.html" class="back">
    ← Giriş sayfası
  </a>

  <h1>Şifreni yenile.</h1>

  <p class="auth-description">
    E-postana gelen 6 haneli kodu gir.
  </p>

  <form id="verifyCodeForm">

    <label>Doğrulama kodu</label>

    <input
      type="text"
      name="code"
      inputmode="numeric"
      maxlength="6"
      placeholder="123456"
      required
    >

    <button type="submit" class="button primary full">
      Kodu Doğrula
    </button>

    <div id="message"></div>

  </form>

  <div id="newPasswordArea" style="display:none;">

    <p class="auth-description">
      Kod doğru. Şimdi yeni şifreni belirle.
    </p>

    <form id="resetPasswordForm">

      <label>Yeni şifre</label>

      <input
        type="password"
        name="password"
        minlength="6"
        placeholder="En az 6 karakter"
        required
      >

      <label>Yeni şifre tekrar</label>

      <input
        type="password"
        name="passwordConfirm"
        minlength="6"
        placeholder="Şifreni tekrar yaz"
        required
      >

      <button type="submit" class="button primary full">
        Şifreyi Değiştir
      </button>

    </form>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
