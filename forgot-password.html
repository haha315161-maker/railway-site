<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifremi Unuttum</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-box">

  <a href="/login.html" class="back">
    ← Giriş sayfası
  </a>

  <h1>Şifreni sıfırla.</h1>

  <p class="auth-description">
    Hesabına kayıtlı e-posta adresini gir.
    Sana 6 haneli bir doğrulama kodu göndereceğiz.
  </p>

  <form id="forgotForm">

    <label>E-posta</label>

    <input
      type="email"
      name="email"
      placeholder="ornek@mail.com"
      required
    >

    <button type="submit" class="button primary full">
      Kod Gönder
    </button>

    <div id="message"></div>

  </form>

</div>

<script src="app.js"></script>

</body>
</html>
